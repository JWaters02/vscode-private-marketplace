trigger: none

pr:
  branches:
    include:
      - "*"

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self
    persistCredentials: true

  - task: UsePythonVersion@0
    displayName: 'Use Python 3.12'
    inputs:
      versionSpec: '>=3.12'

  - script: |
      python .azure/lint.py
    displayName: 'Run VSIX/extensions.json consistency lint'

  - script: |
      python .azure/check_squash.py
    displayName: 'Check PR is squashed to one commit'