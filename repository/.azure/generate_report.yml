trigger:
  paths:
    include:
      - extensions.json

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self
    persistCredentials: true
    fetchDepth: 2

  - task: UsePythonVersion@0
    displayName: 'Use Python 3.12'
    inputs:
      versionSpec: '>=3.12'

  - script: |
      pip install requests
    displayName: 'Install dependencies'

  - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
      - script: |
          python .azure/report.py --webhook "$(GCHAT_WEBHOOK_MAIN)" --branch $(Build.SourceBranchName)
        displayName: 'Run report and post to Google Chat (main)'

  - ${{ if eq(variables['Build.SourceBranchName'], 'test') }}:
      - script: |
          python .azure/report.py --webhook "$(GCHAT_WEBHOOK_TEST)" --branch $(Build.SourceBranchName)
        displayName: 'Run report and post to Google Chat (test)'